spring.application.name=app

# actuator
management.server.port=8081
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=beans,caches,conditions,configprops,env,health,info,loggers,metrics,mappings,scheduledtasks,startup,threaddump

# mqtt
mqtt.url=tcp://broker.mqtt.cool:1883
mqtt.topic=topic

# db
#That's temporary while postgres & timescaledb is not set up
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

